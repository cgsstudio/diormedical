<!-- wp:doc-booker-pro/faq {"blockId":"derm-faq","layoutType":"hairline","openMode":"single","firstOpen":true,"displayHeading":false,"items":[{"id":"q1","question":"How do I book a dermatology appointment?","answer":"Pick a concern or search for a dermatologist, choose an open time on the calendar, and enter your details. The moment it's booked, you get a confirmation.","category":"","icon":"calendar"},{"id":"q2","question":"How fast are biopsy results?","answer":"Our on-site dermatopathology lab returns most biopsy results within 48 hours. As soon as they are ready, you can view them through the records lookup with a one-time passcode.","category":"","icon":"activity"},{"id":"q3","question":"Do you offer both medical and cosmetic dermatology?","answer":"Yes — medical (skin cancer, acne, rosacea, patch testing, pediatric) and cosmetic (laser, injectables, pigment) are handled under one roof by board-certified dermatologists.","category":"","icon":"sparkles"},{"id":"q4","question":"How do I see my reports or biopsy results?","answer":"Use the records lookup above. Enter the phone number and order code from your confirmation, we text you a one-time passcode, and you can view or download every report on that visit. There's no account to create.","category":"","icon":"file"},{"id":"q5","question":"How are payments and insurance handled?","answer":"Each program's \"from\" price is shown before you confirm, and fees are paid online when you book or at your visit, depending on the clinic. Most major plans are accepted — we verify your coverage before the first visit.","category":"","icon":"briefcase"}]} /-->
