<!-- wp:doc-booker-pro/slider {"blockId":"mh-sl","align":"","layoutType":"split","displayHeader":true,"headerEyebrow":"The work","headerTitle":"Steady care, at your pace.","headerDescription":"No quick fixes — just consistent, supportive steps that add up over time.","displaySubtitle":true,"displayTitle":true,"displayDescription":true,"displayButton":true,"autoplay":false,"showNav":true,"showPagination":true,"slides":[{"id":"sl1","image":{"url":"__WPDDBP_IMAGES_URL__/mh-session.jpg","id":0,"alt":"A calm, light-filled counseling session"},"subtitle":"Step 01","title":"Feeling heard","titleTag":"h3","description":"The first session is just about being listened to — no forms to perform, no rush. You set the pace, and we follow it.","buttonText":"Begin gently","buttonURL":"#book"},{"id":"sl2","image":{"url":"__WPDDBP_IMAGES_URL__/mh-couple.jpg","id":0,"alt":"A therapist and client noticing patterns together"},"subtitle":"Step 02","title":"Understanding patterns","titleTag":"h3","description":"Together you'll gently notice what's been weighing on you — not to judge it, but to soften its grip over time. Trauma-informed, kind, and curious.","buttonText":"Begin gently","buttonURL":"#book"},{"id":"sl3","image":{"url":"__WPDDBP_IMAGES_URL__/mh-group.jpg","id":0,"alt":"A small, supportive group session"},"subtitle":"Step 03","title":"Not alone","titleTag":"h3","description":"Whether one-to-one or in a small group, you're reminded that what you feel is human — and shared by more people than you'd think.","buttonText":"Begin gently","buttonURL":"#book"},{"id":"sl4","image":{"url":"__WPDDBP_IMAGES_URL__/mh-mindful.jpg","id":0,"alt":"A person practicing a moment of calm"},"subtitle":"Step 04","title":"Tools that travel","titleTag":"h3","description":"You leave with gentle, practical skills for the harder days — small things that fit into a real life, not a checklist.","buttonText":"Begin gently","buttonURL":"#book"},{"id":"sl5","image":{"url":"__WPDDBP_IMAGES_URL__/mh-calm.jpg","i <!-- wp:doc-booker-pro/faq {"blockId":"mh-faq","layoutType":"hairline","openMode":"single","firstOpen":true,"displayHeading":false,"items":[{"id":"q1","question":"How do I book a session?","answer":"Pick a service or therapist, choose an open time that feels right, and enter your details. A calm confirmation arrives the moment it's booked. Not sure where to start? Book a short first conversation.","category":"","icon":"calendar"},{"id":"q2","question":"Is everything really confidential?","answer":"Yes. What you share stays between you and your therapist — nothing leaves the room without your consent. Our records lookup is scoped to your phone and order code, with no public profile and no account to be found in.","category":"","icon":"shield"},{"id":"q3","question":"Do you have evening or weekend appointments?","answer":"We do — care runs 7am to 9pm including evenings and weekends, so therapy fits around work and life rather than the other way round. Secure video sessions are available when coming in isn't right for you.","category":"","icon":"activity"},{"id":"q4","question":"How do I get my assessment or summary?","answer":"Use the documents lookup on this page: enter the phone number you booked with and the order code from your booking confirmation, verify with a one-time passcode, and view or download your summaries. No account, no password — and only you.","category":"","icon":"file"},{"id":"q5","question":"What if I'm in crisis right now?","answer":"If you\\'re in immediate danger or thinking about harming yourself, please call your local emergency number or a crisis line right away — don\\'t wait for an online booking. Our team is here for ongoing care, and we\\'ll always help you find the right urgent support.","category":"","icon":"heart"}]} /-->
