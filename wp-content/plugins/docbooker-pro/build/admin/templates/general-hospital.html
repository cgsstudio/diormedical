<!-- wp:doc-booker-pro/faq {"blockId":"gh-faq","layoutType":"hairline","openMode":"single","firstOpen":true,"displayHeading":false,"items":[{"id":"q1","question":"How do I book an appointment?","answer":"Pick a department or search for a doctor, choose an open time on the calendar, enter your details, and pay securely — Stripe and Razorpay are both accepted. The moment your booking is set, we text you an SMS confirmation. You can also call our 24/7 line at (800) 555-0100 and the front desk will book it with you.","category":"","icon":"calendar"},{"id":"q2","question":"Do I need an account to book or view my report?","answer":"No. There's no sign-up and no password. Booking just needs your details at the time of the appointment, and your confirmation arrives by SMS. To see a lab result, use the Get your report portal: enter the mobile number you booked with plus the order code from your SMS, verify with a one-time passcode, and view or download your report.","category":"","icon":"user"},{"id":"q3","question":"How are payments handled?","answer":"Appointment fees are collected at the time you book, through our secure Stripe or Razorpay checkout. The consultation fee for each doctor is shown on their card before you confirm, so there are no surprises.","category":"","icon":"briefcase"},{"id":"q4","question":"When will I get my lab or diagnostic results?","answer":"Most routine results from our on-site lab are ready within forty-eight hours. When a report is released, it's attached to your booking order — open the report portal, enter your phone and order code, verify by OTP, and view or download it securely.","category":"","icon":"file"},{"id":"q5","question":"Is the hospital open for emergencies around the clock?","answer":"Yes. Our Main Campus emergency department and trauma bay are staffed 24 hours a day, every day of the year. For a life-threatening emergency always call your local emergency number; for everything else, our 24/7 hotline at (800) 555-0100 can direct you to the right team.","category":"","icon":"clock"}]} /-->
