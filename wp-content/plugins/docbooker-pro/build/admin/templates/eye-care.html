<!-- wp:doc-booker-pro/faq {"blockId":"eye-faq","layoutType":"hairline","openMode":"single","firstOpen":true,"displayHeading":false,"items":[{"id":"q1","question":"How do I book an eye appointment?","answer":"Pick a focus area or search for a specialist, choose an open time on the calendar, enter your details, and pay securely — Stripe and Razorpay are both accepted. The moment it's booked, we text you an SMS confirmation.","category":"","icon":"calendar"},{"id":"q2","question":"Am I a candidate for LASIK?","answer":"Most adults with stable vision are — but the only way to know is a full pre-op workup with wavefront and OCT imaging. Book a same-day LASIK consult and we map your eye before recommending anything.","category":"","icon":"eye"},{"id":"q3","question":"How long is recovery after LASIK or cataract surgery?","answer":"Most LASIK patients see clearly the next morning; cataract recovery is typically 2–3 days. Your surgeon reviews you at every follow-up, all bookable online.","category":"","icon":"activity"},{"id":"q4","question":"How do I see my exam results or scans?","answer":"Use the results lookup above. Enter the phone number and order code from your confirmation SMS, we text you a one-time passcode, and you can view or download every exam, OCT scan, and field report. There's no account to create.","category":"","icon":"file"},{"id":"q5","question":"How are payments and insurance handled?","answer":"Exam and consult fees are collected securely at the time you book via Stripe or Razorpay, and each service's \"from\" price is shown before you confirm. Most major vision plans are accepted — we verify your coverage before the first visit.","category":"","icon":"briefcase"}]} /-->
