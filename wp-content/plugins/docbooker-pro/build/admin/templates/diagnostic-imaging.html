<!-- wp:doc-booker-pro/faq {"blockId":"di-faq","layoutType":"hairline","openMode":"single","firstOpen":true,"displayHeading":false,"items":[{"id":"q1","question":"How do I book a scan?","answer":"Pick a scan or service, choose an available time, enter your details, and pay securely by card. You'll get an SMS confirmation the moment it's booked — nothing to print, nothing to remember. Prefer to talk to someone? Call us at (800) 555-0199 and the front desk will book it with you.","category":"","icon":"calendar"},{"id":"q2","question":"How and when do I get my report?","answer":"Most results land within 24 hours — X-rays in a few hours, CT and ultrasound often same-day, MRI within 24–48 hours. Use the results lookup on this page: enter the phone number you booked with and the order code from your SMS, we text a one-time passcode, and you can view or download every report attached to that order. There's no account and no password — access is scoped to your order and your phone.","category":"","icon":"file"},{"id":"q3","question":"How do I pay, and when?","answer":"Payment is the final step of booking and is taken securely by card. The fee and typical turnaround for each scan are listed up front — there's no surprise figure at the desk. If a service shows no fee online, your booking is captured as a request and the center confirms the cost with you before your visit.","category":"","icon":"briefcase"},{"id":"q4","question":"Do I need a referral?","answer":"Many screening scans and lab panels can be booked directly. Some imaging studies are best ordered by a physician so the radiologist knows exactly what to look for — if a referral helps, the booking flow will tell you before you pay. Not sure which applies to you? Call the front desk and we'll point you to the right scan.","category":"","icon":"help-circle"},{"id":"q5","question":"Is an MRI or CT safe? How long does it take?","answer":"MRI uses a magnetic field and no radiation; most studies take 20–45 minutes. CT uses a low, carefully managed dose of X-rays and is over in minutes. Our technologists will walk you through each step before the scan begins — tell us about any implants or claustrophobia when you book and we'll plan around it.","category":"","icon":"shield"}]} /-->
