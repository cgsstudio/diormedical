<!-- wp:doc-booker-pro/faq {"blockId":"wh-faq","layoutType":"hairline","openMode":"single","firstOpen":true,"displayHeading":false,"items":[{"id":"q1","question":"How do I book an appointment?","answer":"Pick a service or search for an OB-GYN, choose an open time on the calendar, and enter your details. The moment your booking is set, you get a confirmation. You can also call our front desk at (800) 555-0199 and we'll book it with you.","category":"","icon":"calendar"},{"id":"q2","question":"Do I need an account to book or view my report?","answer":"No. There's no sign-up and no password. Booking just needs your details at the time of the appointment, and your confirmation arrives as soon as you book. To see an ultrasound or lab result, use the report lookup: enter the mobile number you booked with plus the order code from your booking confirmation, verify with a one-time passcode, and view or download your report.","category":"","icon":"user"},{"id":"q3","question":"How are payments handled?","answer":"The consultation fee for each service and clinician is shown on their card before you confirm, so there are no surprises. Depending on the clinic, you pay online when you book or at your visit.","category":"","icon":"briefcase"},{"id":"q4","question":"When will my ultrasound or lab results be ready?","answer":"Most routine results from our on-site ultrasound and lab are ready within forty-eight hours. When a report is released, it's attached to your booking order — open the report lookup, enter your phone and order code, verify by OTP, and view or download it securely.","category":"","icon":"activity"},{"id":"q5","question":"Will I see the same OB-GYN throughout my pregnancy?","answer":"Yes — continuity is a core part of how we practice. When you book prenatal care, you choose your clinician and we keep your visits with that same OB-GYN wherever possible. If you'd like to switch, just book with another specialist; there's no paperwork to start over.","category":"","i
