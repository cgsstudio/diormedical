<!-- wp:doc-booker-pro/faq {"blockId":"ped-faq","layoutType":"hairline","openMode":"single","firstOpen":true,"displayHeading":false,"items":[{"id":"q1","question":"How do I book my child's appointment?","answer":"Pick a care area or search for a pediatrician, choose an open time on the calendar that fits your day, and enter your details. The moment it's booked, you get a confirmation.","category":"","icon":"calendar"},{"id":"q2","question":"Do you offer same-day sick visits?","answer":"Yes. We hold same-day slots every day for fevers, ear-aches, rashes and tummy troubles — book the \"Sick Visits\" service online, or call and we'll fit your little one in.","category":"","icon":"activity"},{"id":"q3","question":"Is there help after hours?","answer":"Our after-hours nurse advice line is a real person when the fever spikes at 9pm. For a life-threatening emergency always call your local emergency number; for everything else, the advice line will guide you.","category":"","icon":"phone"},{"id":"q4","question":"How do I see my child's reports or forms?","answer":"Use the records lookup above. Enter the phone number and order code from your confirmation, we text you a one-time passcode, and you can view or download every report and signed form on that visit. There's no account to create.","category":"","icon":"file"},{"id":"q5","question":"How are payments and insurance handled?","answer":"Each service's \"from\" price is shown before you confirm, and visit fees are paid online when you book or at your visit, depending on the clinic. Most major plans are accepted — we verify your coverage before the first visit.","category":"","icon":"briefcase"}]} /-->
