<!-- wp:doc-booker-pro/faq {"blockId":"cardio-faq","layoutType":"hairline","openMode":"single","firstOpen":true,"displayHeading":false,"items":[{"id":"q1","question":"Do I need a referral to see a cardiologist?","answer":"No referral is required to book a consultation. Choose a service and cardiologist, pick a time, and you're set. If you have records from another doctor, you can bring them to your visit.","category":"","icon":"user"},{"id":"q2","question":"How do I pay, and when?","answer":"The consultation fee is shown on each cardiologist before you book. Depending on how the clinic is set up, you pay online at the final step of booking or at your visit — either way your confirmation follows within seconds.","category":"","icon":"briefcase"},{"id":"q3","question":"How will I get my appointment confirmation?","answer":"As soon as you book — with the cardiologist, date, time, and location. That same number is what you'll use to pull your results later via the report lookup.","category":"","icon":"calendar"},{"id":"q4","question":"Can I get my test results without an account?","answer":"Yes. There's no patient portal to register for. Enter your phone number and the order code from your visit slip, verify with a one-time passcode sent to your phone, and view or download your report. The view expires after 15 minutes for your privacy.","category":"","icon":"file"},{"id":"q5","question":"What should I do in a cardiac emergency?","answer":"If you're having chest pain or symptoms of a heart attack, call your local emergency number immediately — do not book online. Our Northvale cath lab runs 24/7 for emergencies routed through emergency services.","category":"","icon":"activity"}]} /-->
