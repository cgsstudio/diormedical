<!-- wp:doc-booker-pro/faq {"blockId":"dc-faq","layoutType":"hairline","openMode":"single","firstOpen":true,"displayHeading":false,"items":[{"id":"q1","question":"How do I book an appointment?","answer":"Use the booking wizard above: choose a service, pick a dentist, then a day and time that fits your week. Enter your details and you're done. The calendar only shows real openings, and you'll get a confirmation the moment it's booked.","category":"","icon":"calendar"},{"id":"q2","question":"How do I pay, and when?","answer":"You'll see the exact \"from\" fee for your treatment before you confirm. Depending on the clinic, you pay online at the end of booking or at your visit — nothing is charged before you confirm.","category":"","icon":"briefcase"},{"id":"q3","question":"How will I know my booking is confirmed?","answer":"You get a confirmation the moment it is booked, with your dentist, date, time and location. To change a booking, call the front desk on (800) 555-0199.","category":"","icon":"clock"},{"id":"q4","question":"How do I see my X-rays or treatment plan?","answer":"Use the records lookup above. Enter the phone number and order code from your confirmation, we text you a one-time passcode, and you can view or download every report on that order. There's no account to create — it's tied to your booking, and links expire after 30 minutes.","category":"","icon":"file"},{"id":"q5","question":"Do you take dental emergencies and walk-ins?","answer":"We hold same-day slots for toothaches and dental emergencies — book the \"Emergency Dentist\" service online, or call the clinic and we'll fit you in. Walk-ins are welcome when there's an open slot; booking ahead guarantees your time.","category":"","icon":"alert-circle"}]} /-->
