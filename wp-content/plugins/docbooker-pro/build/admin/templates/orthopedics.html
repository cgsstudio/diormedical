<!-- wp:doc-booker-pro/faq {"blockId":"ortho-faq","layoutType":"hairline","openMode":"single","firstOpen":true,"displayHeading":false,"items":[{"id":"q1","question":"How do I book an appointment?","answer":"Pick a service or surgeon, choose an available time, and enter your details. You'll get a confirmation the moment it's booked — nothing to print, nothing to remember. Prefer to talk? Call (800) 555-0174.","category":"","icon":"calendar"},{"id":"q2","question":"How do I pay, and when?","answer":"Depending on the clinic, you pay online as the final step of booking or at your visit. The fee for each service is listed up front — there's no surprise figure at the desk.","category":"","icon":"briefcase"},{"id":"q3","question":"How do I get my X-ray or MRI results?","answer":"Use the results lookup on this page: enter the phone number you booked with and the order code from your booking confirmation. We text a one-time passcode, and once you verify it you can view or download every report attached to that order. No account, no password.","category":"","icon":"file"},{"id":"q4","question":"Do I need a referral to see a surgeon?","answer":"No referral is needed to book a consultation — choose the department and surgeon that fit your problem and pick a time. For a fresh injury, Fracture Care offers same-day assessment with on-site X-ray.","category":"","icon":"user"},{"id":"q5","question":"Is physiotherapy really on-site?","answer":"Yes. Both locations have their own physiotherapy gyms, and our rehab team works alongside the surgeons — so your recovery plan is built by the people who know exactly what was repaired. Book rehab the same way you book a surgeon.","category":"","icon":"activity"}]} /-->
