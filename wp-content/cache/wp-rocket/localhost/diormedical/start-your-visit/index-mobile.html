/* =========================================
   DIOR MEDICAL SERVICE CARD
========================================= */

.service-card {
    position: relative;
    overflow: hidden;
    border-radius: 14px;
    transition: all 0.4s ease;
}


.service-card {
    position: relative;
    overflow: hidden;
    border-radius: 14px;
    border: 1px solid #E3E7ED;
    transition: all 0.4s ease;
}

/* =========================================
   KEEP CONTENT ABOVE IMAGE
========================================= */

.service-card > .e-con,
.service-card > .elementor-widget {
    position: relative;
    z-index: 2;
}


/* =========================================
   HEADING
========================================= */

.service-card .service-title,
.service-card .elementor-heading-title {
    color: #1E3F7A;
    transition: color 0.3s ease;
}

.service-card:hover .service-title,
.service-card:hover .elementor-heading-title {
    color: #FFFFFF !important;
}


/* =========================================
   DESCRIPTION
========================================= */

.service-card .service-description,
.service-card .elementor-widget-text-editor {
    color: #666666;
    transition: color 0.3s ease;
}

.service-card:hover .service-description,
.service-card:hover .elementor-widget-text-editor,
.service-card:hover .elementor-widget-text-editor p {
    color: #FFFFFF !important;
}


/* =========================================
   ICON
========================================= */

.service-card .service-icon {
    transition: all 0.3s ease;
}

.service-card:hover .service-icon,
.service-card:hover .service-icon i,
.service-card:hover .service-icon svg {
    color: #FFFFFF !important;
    fill: #FFFFFF !important;
    stroke: #FFFFFF !important;
}


/* =========================================
   ICON CIRCLE
========================================= */

.service-card .service-icon-wrapper {
    transition: all 0.3s ease;
}

.service-card:hover .service-icon-wrapper {
    background: rgba(255, 255, 255, 0.15);
}


/* =========================================
   CARD HOVER
========================================= */

.service-card:hover {
    transform: translateY(-2px);
}
/* Arrow - hidden normally */
.service-arrow {
    position: absolute !important;
    left: 30px;
    bottom: 28px;

    width: 42px;
    height: 42px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 50%;
    
    /* Keep your existing arrow color */
    opacity: 0;
    visibility: hidden;

    transform: translateY(10px);
    transition: opacity 0.3s ease,
                visibility 0.3s ease,
                transform 0.3s ease;

    z-index: 10;
}


/* Arrow appears on hover */
.service-card:hover .service-arrow {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
}
</style>
