$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/api_key/services/all"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: X-Api-Key
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      [
        {
          "duration": "<integer>",
          "title": "<string>",
          "id": "<uuid>",
          "timeBlockBefore": "<integer>",
          "timeBlockAfter": "<integer>",
          "limit": "<integer>",
          "price": "<double>",
          "borderOfDays": "<integer>",
          "blockMinutesAfterNow": "<integer>"
        },
        {
          "duration": "<integer>",
          "title": "<string>",
          "id": "<uuid>",
          "timeBlockBefore": "<integer>",
          "timeBlockAfter": "<integer>",
          "limit": "<integer>",
          "price": "<double>",
          "borderOfDays": "<integer>",
          "blockMinutesAfterNow": "<integer>"
        }
      ]
order: 1000
