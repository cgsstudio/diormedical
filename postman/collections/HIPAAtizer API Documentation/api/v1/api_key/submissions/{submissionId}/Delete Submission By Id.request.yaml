$kind: http-request
url: "{{baseUrl}}/api/v1/api_key/submissions/:submissionId"
method: DELETE
headers:
  Accept: application/json
pathVariables:
  - key: submissionId
    value: <uuid>
    description: (Required) Id of submission
auth:
  type: apikey
  credentials:
    key: X-Api-Key
    value: "{{apiKey}}"
    in: header
examples: ./.resources/Delete Submission By Id.resources/examples
order: 7000
