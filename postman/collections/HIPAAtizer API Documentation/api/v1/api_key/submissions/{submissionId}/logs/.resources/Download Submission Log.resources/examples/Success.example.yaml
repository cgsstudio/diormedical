$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/api_key/submissions/:submissionId/logs"
  method: GET
  headers:
    - key: Accept
      value: application/octet-stream
    - key: X-Api-Key
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  pathVariables:
    submissionId: ""
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: <binary>
order: 1000
