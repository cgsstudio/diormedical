$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/api_key/submissions/:submissionId/pdf?fileOrder=<integer>"
  method: GET
  headers:
    - key: X-Api-Key
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  queryParams:
    - key: fileOrder
      value: <integer>
      description: File order for download. Applicable only to forms created from multiple PDFs.
  pathVariables:
    submissionId: ""
response:
  statusCode: 500
  statusText: Internal Server Error
  body:
    type: text
    content: ""
order: 5000
