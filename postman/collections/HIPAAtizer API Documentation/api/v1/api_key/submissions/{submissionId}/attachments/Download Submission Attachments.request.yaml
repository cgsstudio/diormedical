$kind: http-request
url: "{{baseUrl}}/api/v1/api_key/submissions/:submissionId/attachments"
method: GET
headers:
  Accept: application/octet-stream
pathVariables:
  - key: submissionId
    value: <uuid>
    description: (Required) Id of submission
auth:
  type: apikey
  credentials:
    key: X-Api-Key
    value: "{{apiKey}}"
    in: header
examples: ./.resources/Download Submission Attachments.resources/examples
order: 1000
