$kind: http-request
description: Sends a reminder to the client about a specific appointment. Requires the appointment ID.
url: "{{baseUrl}}/api/v1/api_key/appointments/:appointmentId/remind"
method: POST
headers:
  Accept: application/json
pathVariables:
  - key: appointmentId
    value: <uuid>
    description: (Required) Id of appointment
auth:
  type: apikey
  credentials:
    key: X-Api-Key
    value: "{{apiKey}}"
    in: header
examples: ./.resources/Send Reminder.resources/examples
order: 1000
