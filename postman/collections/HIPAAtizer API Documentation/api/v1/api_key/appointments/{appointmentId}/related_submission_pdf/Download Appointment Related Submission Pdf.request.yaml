$kind: http-request
description: Downloads a PDF of the form submission related to a specific appointment.
url: "{{baseUrl}}/api/v1/api_key/appointments/:appointmentId/related_submission_pdf?useGroupedSubmissionIfExists=<boolean>"
method: GET
headers:
  Accept: application/octet-stream
queryParams:
  useGroupedSubmissionIfExists: <boolean>
pathVariables:
  - key: appointmentId
    value: <uuid>
    description: (Required) Id of appointment
auth:
  type: apikey
  credentials:
    key: X-Api-Key
    value: "{{apiKey}}"
    in: header
examples: ./.resources/Download Appointment Related Submission Pdf.resources/examples
order: 1000
