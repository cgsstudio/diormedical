$kind: http-request
url: "{{baseUrl}}/api/v1/api_key/appointments/:appointmentId"
method: PUT
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  - key: appointmentId
    value: <uuid>
    description: (Required) Id of appointment
body:
  type: json
  content: |-
    {
      "date": "<string>",
      "locationId": "<uuid>",
      "serviceId": "<uuid>",
      "workerId": "<uuid>",
      "firstName": "<string>",
      "lastName": "<string>",
      "email": "<string>",
      "phone": "<string>"
    }
auth:
  type: apikey
  credentials:
    key: X-Api-Key
    value: "{{apiKey}}"
    in: header
examples: ./.resources/Update Appointment.resources/examples
order: 4000
