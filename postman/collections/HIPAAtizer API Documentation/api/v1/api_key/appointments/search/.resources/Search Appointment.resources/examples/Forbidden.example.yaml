      value: application/json
    - key: X-Api-Key
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  body:
    type: json
    content: |-
      {
        "pagination": {
          "page": "<integer>",
          "limit": "<integer>"
        },
        "search": "<string>",
        "locationIds": [
          "<uuid>",
          "<uuid>"
        ],
        "workerIds": [
          "<uuid>",
          "<uuid>"
        ],
        "serviceIds": [
          "<uuid>",
          "<uuid>"
        ],
        "dateRange": {
          "from": "<string>",
          "to": "<string>"
        }
      }
response:
  statusCode: 403
  statusText: Forbidden
  body:
    type: text
    content: ""
order: 4000
