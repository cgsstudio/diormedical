$kind: http-request
description: Allows you to search for appointments based on filters such as location, service, or date range. Returns a paginated list of matching appointments.
url: "{{baseUrl}}/api/v1/api_key/appointments/search"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "pagination": {
        "page": "<integer>",
        "limit": "<integer>"
      },
      "search": "<string>",
      "locationIds": [
        "<uuid>",
        "<uuid>"
      ],
      "workerIds": [
        "<uuid>",
        "<uuid>"
      ],
      "serviceIds": [
        "<uuid>",
        "<uuid>"
      ],
      "dateRange": {
        "from": "<string>",
        "to": "<string>"
      }
    }
auth:
  type: apikey
  credentials:
    key: X-Api-Key
    value: "{{apiKey}}"
    in: header
examples: ./.resources/Search Appointment.resources/examples
order: 1000
