$kind: http-request
description: Fetches the calendar view of appointments for a specific month and year across selected locations.
url: "{{baseUrl}}/api/v1/api_key/appointments/calendar"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "month": "February",
      "year": "<integer>",
      "locationIds": [
        "<uuid>",
        "<uuid>"
      ]
    }
auth:
  type: apikey
  credentials:
    key: X-Api-Key
    value: "{{apiKey}}"
    in: header
examples: ./.resources/List Appointment Calendar.resources/examples
order: 1000
