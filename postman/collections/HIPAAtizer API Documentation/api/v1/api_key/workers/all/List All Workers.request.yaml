$kind: http-request
url: "{{baseUrl}}/api/v1/api_key/workers/all"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "locationIds": [
        "<uuid>",
        "<uuid>"
      ]
    }
auth:
  type: apikey
  credentials:
    key: X-Api-Key
    value: "{{apiKey}}"
    in: header
examples: ./.resources/List All Workers.resources/examples
order: 1000
